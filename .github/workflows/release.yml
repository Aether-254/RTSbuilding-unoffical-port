name: Release

on:
  push:
    tags:
      - 'v*'  # 当推送 v* 格式的标签时触发
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., v1.2.3)'
        required: true
        type: string
      pre_release:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          if [ "${{ inputs.skip_tests }}" == "true" ]; then
            ./gradlew build -x test --no-daemon --build-cache
          else
            ./gradlew build --no-daemon --build-cache --parallel
          fi

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event_name == 'push' && github.ref_name || '' }}" ]; then
            # 从标签获取版本号
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=v$VERSION" >> $GITHUB_OUTPUT
            echo "Releasing version: $VERSION from tag"
          else
            # 从手动输入获取版本号
            VERSION="${{ inputs.release_version }}"
            VERSION="${VERSION#v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=v$VERSION" >> $GITHUB_OUTPUT
            echo "Releasing version: $VERSION from manual input"
          fi

      - name: Build release artifacts
        run: |
          ./gradlew clean build --no-daemon

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: ${{ inputs.pre_release }}
          generate_release_notes: true
          files: |
            build/libs/*.jar
            build/libs/*.war
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
