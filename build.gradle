plugins {
    id "fabric-loom" version "1.15.4"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository {
            maven { url = "https://api.modrinth.com/maven" }
        }
        filter { includeGroup "maven.modrinth" }
    }
    mavenCentral()
}

sourceSets {
    emiApi {
        java.srcDir "src/emiApi/java"
        compileClasspath += sourceSets.main.compileClasspath
    }
    uiCore {
        java.srcDir "src/uiCore/java"
        resources.setSrcDirs([])
    }
    uiKit {
        java.srcDir "src/uiKit/java"
        resources.setSrcDirs([])
        compileClasspath += sourceSets.uiCore.output
        runtimeClasspath += sourceSets.uiCore.output
    }
    main {
        compileClasspath += sourceSets.uiCore.output + sourceSets.uiKit.output
        compileClasspath += sourceSets.emiApi.output
        runtimeClasspath += sourceSets.uiCore.output + sourceSets.uiKit.output
        java.exclude "awa/Aether_254/rtsbuilding/compat/ae2/**"
        java.exclude "awa/Aether_254/rtsbuilding/compat/bd/**"
        java.exclude "awa/Aether_254/rtsbuilding/compat/ftb/**"
        java.exclude "awa/Aether_254/rtsbuilding/compat/jade/**"
        java.exclude "awa/Aether_254/rtsbuilding/compat/jei/**"
        java.exclude "awa/Aether_254/rtsbuilding/compat/openpac/**"
        java.exclude "awa/Aether_254/rtsbuilding/compat/refinedstorage/**"
        java.exclude "awa/Aether_254/rtsbuilding/compat/sophisticatedbackpacks/**"
        java.exclude "awa/Aether_254/rtsbuilding/gametest/**"
        java.exclude "awa/Aether_254/rtsbuilding/mixin/JadeClientProxyMixin.java"
        java.exclude "awa/Aether_254/rtsbuilding/mixin/WailaTickHandlerMixin.java"
        java.exclude "awa/Aether_254/rtsbuilding/mixin/KeyMappingAccessor.java"
        java.exclude "awa/Aether_254/rtsbuilding/client/rendering/**"
        java.exclude "awa/Aether_254/rtsbuilding/client/camera/RtsCameraEntityRenderer.java"
        java.exclude "awa/Aether_254/rtsbuilding/client/bootstrap/RtsClientModEvents.java"
        java.exclude "awa/Aether_254/rtsbuilding/client/event/**"
        java.exclude "awa/Aether_254/rtsbuilding/client/input/RtsClientInputGate.java"
        java.exclude "awa/Aether_254/rtsbuilding/client/input/overlay/**"
        java.exclude "awa/Aether_254/rtsbuilding/client/plugin/RtsPluginInventoryScreenEvents.java"
        java.exclude "awa/Aether_254/rtsbuilding/client/compat/RtsClientOnboardingReminder.java"
        java.exclude "awa/Aether_254/rtsbuilding/client/compat/RtsGuiCompatProbe.java"
        java.exclude "awa/Aether_254/rtsbuilding/mixin/BlockEntityRenderDispatcherMixin.java"
        java.exclude "awa/Aether_254/rtsbuilding/mixin/BlockRenderDispatcherMixin.java"
        java.exclude "awa/Aether_254/rtsbuilding/mixin/EmbeddiumWorldSliceMixin.java"
        java.exclude "awa/Aether_254/rtsbuilding/mixin/SodiumLevelSliceMixin.java"
        java.exclude "awa/Aether_254/rtsbuilding/mixin/RenderChunkRegionMixin.java"
        resources.exclude "rtsbuilding.jade_mixins.json"
    }
    test {
        java.setSrcDirs([])
        resources.setSrcDirs([])
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "maven.modrinth:create-fly:${project.create_fly_version}"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

tasks.named("compileUiCoreJava", JavaCompile) {
    options.release = 8
}

tasks.named("compileUiKitJava", JavaCompile) {
    dependsOn tasks.named("compileUiCoreJava")
    options.release = 8
}

tasks.named("compileJava") {
    dependsOn tasks.named("compileEmiApiJava")
    dependsOn tasks.named("compileUiCoreJava")
    dependsOn tasks.named("compileUiKitJava")
}

tasks.named("jar", Jar) {
    from sourceSets.uiCore.output
    from sourceSets.uiKit.output
}

processResources {
    dependsOn "verifyPinyinDictionary"
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.register("verifyPinyinDictionary") {
    def dictionary = file("src/main/resources/assets/rtsbuilding/pinyin/data.txt")
    inputs.file(dictionary)
    doLast {
        if (!dictionary.isFile() || dictionary.length() < 250_000L) {
            throw new GradleException("Missing or truncated pinyin dictionary: ${dictionary}")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
    options.compilerArgs.addAll(["-Xmaxerrs", "3000"])
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
